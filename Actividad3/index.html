<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
    <title>Actividad 3</title>
</head>

<body>

    <main>

        <section id="vista-acceso">

            <header>
                <h1>Acceso</h1>
            </header>

            <form class="form-de-acceso" id="formulario">
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <button type="submit">Ingresar</button>
            </form>

            <p id="mensaje-error"></p>
            
        </section>

        <section id="vista-bienvenida" hidden>
            <h1 id="saludo"></h1>
            <button type="button" id="boton-volver">Volver</button>
        </section>


    </main>
    
</body>

</html>
