<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad7</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>

<body>

    <main>

        <form class="contenedor-buscador" id="formulario">

            <h1>Busca un país del que quieras informarte</h1>

            <input type="search" id="buscador" placeholder="País a buscar" autocomplete="off">
            
        </form>

        <section class="contenedor-grilla-paises" id="grilla-paises"></section>

        <dialog id="popup">

            <h2 id="popup-nombre"></h2>
            <img id="popup-bandera" alt="">
            <p id="popup-info"></p>
            <button id="popup-cerrar">Cerrar</button>

        </dialog>

    </main>
    
</body>

</html>
