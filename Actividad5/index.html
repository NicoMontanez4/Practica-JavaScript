<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
    <title>Actividad5</title>
</head>

<body>

    <main>

        <h1>Mis tareas</h1>

        <form class="formularioTareas" id="formulario-tareas">

            <label for="tarea"></label>
            <input type="text" name="tarea" id="tarea" placeholder="Ingrese una tarea">

            <button type="submit" id="boton-agregar-tarea">Agregar</button>

        </form>

        <section class="contenedorTareas" id="contenedor-tareas">

            <p id="mensaje-error"></p>
            <p id="mensaje-vacio">No hay tareas pendientes</p>
            <ul id="lista-tareas"></ul>

        </section>

        

    </main>
    
</body>

</html>
