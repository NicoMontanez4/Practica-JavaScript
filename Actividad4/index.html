<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
    <title>Actividad4</title>
</head>

<body>

    <main>

        <section class="contenedor-calculadora">

            <h1>Suma de dos números</h1>

            <form class="numerosCalculadora" id="numeros-calculadora">

                <div class="campo">

                    <label for="numero1">Primer Numero</label>
                    <input type="number" name="numero1" id="numero1" >

                </div>

                <div class="campo">

                    <label for="numero2">Segundo Numero</label>
                    <input type="number" name="numero2" id="numero2" >

                </div>

                <div class="botones">

                    <button type="button" class="botonSumar" id="boton-sumar">Sumar</button>
                    <button type="button" class="botonLimpiar" id="boton-limpiar">Limpiar</button>
                
                </div>

            </form>

            <p class="mensaje" id="mensaje"></p>
            <p class="resultado" id="resultado"></p>

        </section>

    </main>
    
</body>


</html>
